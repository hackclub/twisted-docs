server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location /static/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.css$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
